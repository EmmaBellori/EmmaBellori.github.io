name: Deploy root GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'EmmaBellori/EmmaBellori.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Test automatic collection counters
        run: python3 -m unittest discover -s tests -p 'test_collection_stats.py'

      - name: Validate new-release catalog, landing pages and homepage ordering
        run: python3 -m unittest discover -s tests -p 'test_publication_sync.py'

      - name: Build root site and legacy redirects
        run: python3 scripts/build_root_site.py

      - name: Generate growth guide clusters
        run: python3 scripts/generate_growth_guides.py

      - name: Add Free Activity Club privacy information
        run: python3 scripts/add_activity_club_privacy.py

      - name: Inject conversion tracking
        run: python3 scripts/inject_conversion_tracking.py

      - name: Inject Free Activity Club
        run: python3 scripts/inject_activity_club.py

      - name: Apply security metadata and block accidental credential deployments
        run: python3 scripts/harden_site.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.repository == 'EmmaBellori/EmmaBellori.github.io'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
