name: Legacy book catalog (retired)

# The live website now uses catalog.json as its canonical source.
# The old books.json generator overwrote hand-curated product pages,
# direct Payhip purchase links and the full root sitemap.
# It must not run on push or be used to publish new titles.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the canonical publishing path
        run: |
          echo "Legacy catalog generator is retired."
          echo "Do not regenerate published book pages from books.json."
          echo "Use catalog.json and PUBLISHING_GUIDE.md to publish titles."
          echo "This check never modifies site pages or the sitemap."
