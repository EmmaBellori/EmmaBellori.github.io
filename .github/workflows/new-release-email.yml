name: New book release emails

on:
  schedule:
    # Auto-send once daily, grouping same-day releases into one newsletter.
    # GitHub schedules run in UTC. 09:20 UTC is 10:20/11:20 in Rome.
    - cron: "20 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview or create a Klaviyo draft (no sending)"
        required: false
        default: "draft"
        type: choice
        options:
          - preview
          - draft
      preview_ids:
        description: "Optional: comma-separated published book IDs for a safe preview"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/new-release-email.yml"
      - "scripts/release_email_campaign.py"
  pull_request:
    paths:
      - "scripts/release_email_campaign.py"
      - "growth/release-email-state.json"
      - "tests/test_release_email.py"
      - ".github/workflows/new-release-email.yml"

permissions:
  contents: read

concurrency:
  group: new-release-email-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -p 'test_release_email.py' -v
      - name: Produce a safe two-book layout preview
        run: python scripts/release_email_campaign.py --mode preview --preview-ids reindeer,cute-animals-bold-easy
      - name: Upload example newsletter for visual review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-new-books-email
          path: artifacts/new-release-email/
          retention-days: 14

  connection-test:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate Klaviyo draft creation without sending
        run: python scripts/release_email_campaign.py --mode draft --test-draft-ids reindeer,cute-animals-bold-easy

  release-email:
    needs: checks
    # Pushes are for isolated integration tests, never for release processing.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
      # Explicitly approved 2026-11-04: scheduled releases can send autonomously.
      # A manual dispatch is always preview or draft, never auto-send.
      RELEASE_EMAIL_ALLOW_SEND: "YES_I_APPROVE"
      PREVIEW_IDS: ${{ inputs.preview_ids || '' }}
      DISPATCH_MODE: ${{ inputs.mode || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build preview or Klaviyo campaign
        shell: bash
        run: |
          set -euo pipefail
          MODE=draft
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then MODE=send; fi
          if [[ -n "$DISPATCH_MODE" ]]; then MODE="$DISPATCH_MODE"; fi
          if [[ -n "$PREVIEW_IDS" ]]; then MODE=preview; fi
          ARGS=(--mode "$MODE")
          if [[ -n "$PREVIEW_IDS" ]]; then ARGS+=(--preview-ids "$PREVIEW_IDS"); fi
          python scripts/release_email_campaign.py "${ARGS[@]}"
      - name: Upload email preview for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: new-book-release-newsletter
          path: artifacts/new-release-email/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save announcement ledger only after successful Klaviyo preparation
        shell: bash
        run: |
          set -euo pipefail
          git add growth/release-email-state.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record drafted new-release newsletter [skip ci]"
            git push
          fi
